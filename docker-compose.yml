# Full local stack — infra + all app services (audit: previous compose left the
# app services commented out). Credentials come from the environment / .env, not
# hardcoded. Build contexts are the repo root because the Dockerfiles COPY from
# backend/ and frontend/.

services:
  # NOTE: defaults below match the app's .env files for local dev
  # (postgres/postgres, guest/guest, Redis no-password). Override via a root
  # .env for anything beyond local development.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybersentinel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/api_service/Dockerfile
    env_file: [./backend/api_service/.env]
    # Inside the compose network, reach infra by SERVICE NAME (the .env uses
    # localhost, which is correct only when services run on the host).
    environment: &svc_hosts
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cybersentinel}
      REDIS_URL: redis://redis:6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  # Single worker binary: the redesigned scan-execution engine (ASM + VS + CA).
  consumer:
    build:
      context: .
      dockerfile: worker/deploy/Dockerfile
    env_file: [./worker/.env]
    environment:
      POSTGRESQL_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cybersentinel}?sslmode=disable
      REDISADDR: redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  # Reporting consumers — one per service (reporting.asm/vs/ca). They reuse the
  # api image (same deps + backend code); only the command differs.
  reporting-asm: &reporting
    build:
      context: .
      dockerfile: backend/api_service/Dockerfile
    env_file: [./backend/api_service/.env]
    environment:
      <<: *svc_hosts
      PYTHONPATH: /app:/app/backend:/app/backend/api_service
    command: ["python", "-m", "backend.reporting.asm"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped
  reporting-vs:
    <<: *reporting
    command: ["python", "-m", "backend.reporting.vs"]
  reporting-ca:
    <<: *reporting
    command: ["python", "-m", "backend.reporting.ca"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["8080:8080"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
