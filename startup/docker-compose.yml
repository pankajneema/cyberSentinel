version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cybersentinel-postgres
    environment:
      POSTGRES_DB: cybersentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cybersentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cybersentinel-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api_service:
    build:
      context: ..
      dockerfile: backend/api_service/Dockerfile
    container_name: cybersentinel-api
    env_file:
      - ../backend/api_service/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  reporting:
    build:
      context: ..
      dockerfile: backend/reporting/Dockerfile
    container_name: cybersentinel-reporting
    env_file:
      - ../backend/api_service/.env
      - ../backend/workers/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker_control_plane:
    build:
      context: ..
      dockerfile: backend/workers/Dockerfile
    container_name: cybersentinel-control-plane
    env_file:
      - ../backend/workers/.env
    command: ["go", "run", "./control-plane/cmd/"]
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker_consumer:
    build:
      context: ..
      dockerfile: backend/workers/Dockerfile
    container_name: cybersentinel-consumer
    env_file:
      - ../backend/workers/.env
    command: ["go", "run", "./consumer/cmd/asm/"]
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: cybersentinel-frontend
    ports:
      - "8080:8080"
    depends_on:
      - api_service

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
